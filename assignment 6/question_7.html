<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loading Animation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 25px;
            font-family: Arial, sans-serif;
            background: #172b4d;
            color: white;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffc857;
            animation: bounce 0.8s ease-in-out infinite;
        }

        .circle:nth-child(2) {
            animation-delay: 0.15s;
            background: #53d8fb;
        }

        .circle:nth-child(3) {
            animation-delay: 0.3s;
            background: #ff7b9c;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }
    </style>
</head>
<body>

<h1>Please Wait</h1>

<div class="loader" aria-label="Loading">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<p>Loading your content...</p>

</body>
</html>
