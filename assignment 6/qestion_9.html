<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Flip</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            font-family: Arial, sans-serif;
            background: #f0f4fa;
            color: #263247;
        }

        .scene {
            width: 300px;
            height: 380px;
            perspective: 1000px;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .scene:hover .card {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            border-radius: 16px;
            background: white;
            box-shadow: 0 10px 25px #00000020;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .front img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .back {
            background: #173f73;
            color: white;
            transform: rotateY(180deg);
        }

        .back h2 {
            color: #ffc857;
        }
    </style>
</head>
<body>

<h1>CSS Card Flip</h1>
<p>Hover over the card to flip it.</p>

<div class="scene">
    <div class="card">
        <section class="face front">
            <h2>Beautiful Mountains</h2>
            <img
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"
                alt="Mountain landscape"
            >
            <p>Discover the beauty of nature.</p>
        </section>

        <section class="face back">
            <h2>Explore Nature</h2>
            <p>
                Mountains offer fresh air, beautiful scenery,
                adventure, and peaceful surroundings.
            </p>
            <p>Plan your next adventure!</p>
        </section>
    </div>
</div>

</body>
</html>
