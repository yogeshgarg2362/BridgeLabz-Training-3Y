<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263247;
        }

        header {
            padding: 22px;
            background: #17324d;
            color: white;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            background: #284b70;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #ffc857;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 40px 20px;
        }

        .box {
            flex: 1 1 220px;
            max-width: 320px;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: white;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 5px 15px #00000012;
            transition: transform 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            width: 100%;
            padding: 18px;
            background: #17324d;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
</header>

<nav>
    <a href="#services">Services</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
</nav>

<main>
    <section class="box" id="services">
        <h2>Services</h2>
        <p>We provide quality web development services.</p>
    </section>

    <section class="box" id="projects">
        <h2>Projects</h2>
        <p>Explore our creative and technical projects.</p>
    </section>

    <section class="box" id="contact">
        <h2>Contact</h2>
        <p>Get in touch to discuss your ideas.</p>
    </section>
</main>

<footer>
    <p>&copy; 2026 My Website</p>
</footer>

</body>
</html>
