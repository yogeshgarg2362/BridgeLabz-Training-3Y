<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263247;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 22px;
        }

        figure {
            margin: 0;
            overflow: hidden;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px #00000012;
        }

        figure img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>My Photo Gallery</h1>

<main class="gallery">
    <figure>
        <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"
            alt="Mountain landscape"
        >
        <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
        <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80"
            alt="Lake and mountains"
        >
        <figcaption>Beautiful Lake</figcaption>
    </figure>

    <figure>
        <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80"
            alt="Green forest"
        >
        <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
        <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80"
            alt="Ocean and beach"
        >
        <figcaption>Sunny Beach</figcaption>
    </figure>

    <figure>
        <img
            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"
            alt="Snowy mountain peaks"
        >
        <figcaption>Snowy Peaks</figcaption>
    </figure>

    <figure>
        <img
            src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=700&q=80"
            alt="Forest trees"
        >
        <figcaption>Forest Trail</figcaption>
    </figure>
</main>

</body>
</html>
