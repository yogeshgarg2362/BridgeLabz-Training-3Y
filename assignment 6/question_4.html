<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #263247;
        }

        .dashboard {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: auto 1fr;
            gap: 20px;
            padding: 20px;
        }

        header {
            grid-column: 1 / -1;
            padding: 22px;
            background: #17324d;
            color: white;
            border-radius: 12px;
        }

        header h1 {
            margin: 0;
        }

        aside {
            padding: 20px;
            background: #284b70;
            color: white;
            border-radius: 12px;
        }

        aside a {
            display: block;
            padding: 12px 8px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        aside a:hover {
            background: #416b96;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(150px, auto);
            gap: 20px;
        }

        .box {
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000010;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .box:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 22px #00000020;
        }

        /* This card spans both content columns. */
        .wide {
            grid-column: span 2;
            background: #dcecff;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            header {
                grid-column: 1;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Admin Dashboard</h1>
        <p>Overview of your workspace</p>
    </header>

    <aside>
        <h2>Menu</h2>
        <nav>
            <a href="#overview">Overview</a>
            <a href="#analytics">Analytics</a>
            <a href="#projects">Projects</a>
            <a href="#settings">Settings</a>
        </nav>
    </aside>

    <main class="content">
        <section class="box wide" id="overview">
            <h2>Overview</h2>
            <p>This card spans two columns in the grid.</p>
        </section>

        <section class="box" id="analytics">
            <h2>Analytics</h2>
            <p>View your performance and statistics.</p>
        </section>

        <section class="box" id="projects">
            <h2>Projects</h2>
            <p>Manage your current projects.</p>
        </section>

        <section class="box" id="settings">
            <h2>Settings</h2>
            <p>Customize your dashboard preferences.</p>
        </section>
    </main>
</div>

</body>
</html>
