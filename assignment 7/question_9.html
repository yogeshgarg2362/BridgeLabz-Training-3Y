<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #f7efff);
            color: #26364b;
        }

        header, footer {
            text-align: center;
            padding: 20px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        form {
            width: min(100%, 520px);
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px #223a571f;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #aab7c8;
            border-radius: 8px;
            font: inherit;
            box-shadow: inset 0 1px 3px #26364b0d;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* Dashed outline for inputs. */
        input {
            outline: 2px dashed transparent;
            outline-offset: 3px;
        }

        /* Dotted outline for textarea. */
        textarea {
            outline: 2px dotted transparent;
            outline-offset: 4px;
        }

        /* Change outline color when focused. */
        input:focus,
        textarea:focus {
            outline-color: #5b6ee1;
            border-color: #5b6ee1;
            box-shadow: 0 0 0 3px #5b6ee126;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #3347b0;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.25s ease,
                        transform 0.25s ease;
        }

        button:hover {
            background: #25358b;
            transform: translateY(-2px);
        }

        button:focus {
            outline: 3px solid #f0ad4e;
            outline-offset: 3px;
        }
    </style>
</head>
<body>

<header>
    <h1>Outline and Focus Styling</h1>
    <p>Select an input to see its focus outline.</p>
</header>

<main>
    <form action="#" method="get">
        <div class="field">
            <label for="name">Your Name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter your name"
            >
        </div>

        <div class="field">
            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
            >
        </div>

        <div class="field">
            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
            ></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
</main>

<footer>
    <p>Focus indicators help users navigate forms with a keyboard.</p>
</footer>

</body>
</html>
