<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        header, footer {
            text-align: center;
            padding: 20px;
            background: #17324d;
            color: white;
        }

        main {
            padding: 32px 20px;
        }

        /* Flexbox aligns boxes horizontally. */
        .box-row {
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            flex: 1 1 180px;
            max-width: 240px;
            min-height: 150px;
            background: white;
            border: 4px solid #2878b5;
            padding: 18px;
            border-radius: 8px;
            transition: border-color 0.3s ease,
                        transform 0.3s ease;
        }

        .box:hover {
            border-color: #e05d44;
            transform: translateY(-4px);
        }

        .solid {
            border-style: solid;
            padding: 12px;
        }

        .dashed {
            border-style: dashed;
            padding: 20px;
        }

        .double {
            border-style: double;
            border-width: 7px;
            padding: 28px;
        }

        .groove {
            border-style: groove;
            padding: 36px;
            border-radius: 20px;
        }

        h2 {
            font-size: 18px;
        }
    </style>
</head>
<body>

<header>
    <h1>Borders and Padding</h1>
    <p>Hover over a box to change its border color.</p>
</header>

<main>
    <section class="box-row">
        <article class="box solid">
            <h2>Solid Border</h2>
            <p>Padding: 12px</p>
        </article>

        <article class="box dashed">
            <h2>Dashed Border</h2>
            <p>Padding: 20px</p>
        </article>

        <article class="box double">
            <h2>Double Border</h2>
            <p>Padding: 28px</p>
        </article>

        <article class="box groove">
            <h2>Groove Border</h2>
            <p>Padding: 36px</p>
        </article>
    </section>
</main>

<footer>
    <p>CSS Borders and Padding Demonstration</p>
</footer>

</body>
</html>
