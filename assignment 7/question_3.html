<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 16px;
            text-align: center;
            background: #14213de8;
        }

        header h1 {
            margin: 0;
        }

        main {
            padding-top: 78px;
        }

        .gradient-section {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        /* Linear gradient blends colors along a line. */
        .linear {
            background: linear-gradient(
                135deg,
                #0f9b8e,
                #3454d1,
                #6b2d8f
            );
            background-attachment: fixed;
        }

        /* Radial gradient spreads colors from a central point. */
        .radial {
            background: radial-gradient(
                circle at center,
                #ffcf70 0%,
                #f07167 45%,
                #8b2f5b 100%
            );
        }

        .panel {
            max-width: 680px;
            padding: 28px;
            border: 1px solid #ffffff80;
            border-radius: 16px;
            background: #ffffff20;
            box-shadow: 0 10px 30px #0002;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            text-align: center;
            background: #14213de8;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>CSS Gradient Gallery</h1>
</header>

<main>
    <section class="gradient-section linear">
        <div class="panel">
            <h2>Linear Gradient</h2>
            <p>
                A linear gradient blends colors along a straight line.
                This section uses background-attachment: fixed
                for a parallax-like effect.
            </p>
        </div>
    </section>

    <section class="gradient-section radial">
        <div class="panel">
            <h2>Radial Gradient</h2>
            <p>
                A radial gradient spreads colors outward
                from a central point.
            </p>
        </div>
    </section>
</main>

<footer>
    <p>Gradient Background Demonstration</p>
</footer>

</body>
</html>
