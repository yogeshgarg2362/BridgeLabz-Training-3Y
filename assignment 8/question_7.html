
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f3e8ff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ui-card {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #00000018;
    }

    .ui-card h1 { margin-top: 0; }

    .search-form {
      display: flex;
      gap: 10px;
      margin: 25px 0;
    }

    input, select, button {
      font: inherit;
      padding: 12px;
      border: 1px solid #ccd3dd;
      border-radius: 7px;
    }

    input, select { width: 100%; }

    input:focus, select:focus {
      outline: 3px solid #bfdbfe;
      border-color: #1769aa;
    }

    button {
      border: none;
      background: #1769aa;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover { background: #104c7d; }
    button:active { transform: scale(0.97); }

    .component-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .secondary { background: #6c757d; }
    .secondary:hover { background: #495057; }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 25px;
    }

    @media (max-width: 480px) {
      .ui-card { padding: 20px; }
      .search-form { flex-direction: column; }
      .search-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="ui-card">
    <h1>UI Components</h1>
    <p>A simple interface built with HTML and CSS.</p>

    <form class="search-form" action="#" method="get">
      <input type="search" name="q" placeholder="Search here..." aria-label="Search">
      <button type="submit">Search</button>
    </form>

    <h2>Action Buttons</h2>
    <div class="component-row">
      <button type="button">Primary Action</button>
      <button type="button" class="secondary">Secondary Action</button>
    </div>

    <div class="select-group">
      <label for="category">Choose a category</label>
      <select id="category" name="category">
        <option value="">Select an option</option>
        <option value="design">Web Design</option>
        <option value="development">Development</option>
        <option value="security">Cybersecurity</option>
      </select>
    </div>

    <p>Tip: Use Tab to navigate through the controls and view focus styles.</p>
  </main>
</body>
</html>
