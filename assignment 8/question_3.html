
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    header { text-align: center; margin-bottom: 30px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: auto;
    }

    figure {
      margin: 0;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px #00000018;
    }

    .image-wrapper {
      position: relative;
      overflow: hidden;
    }

    .image-wrapper img {
      display: block;
      width: 100%;
      height: 230px;
      object-fit: cover;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .image-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    figure:hover .image-wrapper img {
      transform: scale(1.1);
      filter: brightness(0.75);
    }

    figure:hover .image-wrapper::after {
      opacity: 1;
    }

    figcaption { padding: 15px; text-align: center; }

    @media (max-width: 900px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .gallery { grid-template-columns: 1fr; }
      .image-wrapper img { height: 250px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
    <p>Six photographs with hover transformations and overlays.</p>
  </header>

  <main>
    <section class="gallery">
      <figure>
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Mountain scenery">
        </div>
        <figcaption>Mountain Adventures</figcaption>
      </figure>

      <figure>
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700" alt="Tropical beach">
        </div>
        <figcaption>Tropical Beaches</figcaption>
      </figure>

      <figure>
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Lake and mountains">
        </div>
        <figcaption>Peaceful Lakes</figcaption>
      </figure>

      <figure>
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Green forest">
        </div>
        <figcaption>Green Forests</figcaption>
      </figure>

      <figure>
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=700" alt="Starry night sky">
        </div>
        <figcaption>Starry Nights</figcaption>
      </figure>

      <figure>
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700" alt="Snow-covered mountains">
        </div>
        <figcaption>Snowy Peaks</figcaption>
      </figure>
    </section>
  </main>

  <footer class="text-center mt-5">
    <p>&copy; 2026 Image Showcase</p>
  </footer>
</body>
</html>
