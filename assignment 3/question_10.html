
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Preference Selection</title>
</head>
<body>
    <header>
        <h1>Travel Preference Selection</h1>
    </header>

    <main>
        <form action="#" method="get">
            <p>
                <label for="country">Country:</label>
                <select id="country" name="country">
                    <option selected>India</option>
                    <option>Japan</option>
                    <option>France</option>
                    <option>Australia</option>
                </select>
            </p>

            <p>
                <label for="state">State:</label>
                <select id="state" name="state">
                    <option selected>Uttar Pradesh</option>
                    <option>Rajasthan</option>
                    <option>Himachal Pradesh</option>
                    <option>Kerala</option>
                </select>
            </p>

            <p>
                <label for="city">City:</label>
                <select id="city" name="city">
                    <option selected>Agra</option>
                    <option>Jaipur</option>
                    <option>Manali</option>
                    <option>Kochi</option>
                </select>
            </p>

            <p>
                <label for="place">Favorite Tourist Place:</label>
                <select id="place" name="place">
                    <option selected>Taj Mahal</option>
                    <option>Amber Fort</option>
                    <option>Solang Valley</option>
                    <option>Fort Kochi</option>
                </select>
            </p>

            <button type="submit">Submit Choices</button>
        </form>

        <p>
            My selected travel preferences are: Country — India;
            State — Uttar Pradesh; City — Agra;
            Favorite Tourist Place — Taj Mahal.
        </p>
    </main>
</body>
</html>
