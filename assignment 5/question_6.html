
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h1 { text-align: center; margin-bottom: 30px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            max-width: 1200px;
            margin: auto;
        }

        figure {
            position: relative;
            overflow: hidden;
            margin: 0;
            height: 250px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #00000025;
            background: #ddd;
        }

        figure img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        figure figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 18px;
            text-align: center;
            color: white;
            background: #000000b8;
            opacity: 0;
            transition: opacity 0.4s;
        }

        figure:hover img { transform: scale(1.1); }
        figure:hover figcaption { opacity: 1; }

        @media (max-width: 500px) {
            body { padding: 15px; }
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>Nature Photo Gallery</h1>

    <main class="gallery">
        <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Mountain landscape">
            <figcaption>Mountain Landscape</figcaption>
        </figure>
        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake and mountains">
            <figcaption>Peaceful Lake</figcaption>
        </figure>
        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Green forest">
            <figcaption>Green Forest</figcaption>
        </figure>
        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Ocean beach">
            <figcaption>Ocean Beach</figcaption>
        </figure>
        <figure>
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise over a field">
            <figcaption>Golden Sunrise</figcaption>
        </figure>
        <figure>
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Snow-covered mountains">
            <figcaption>Snowy Peaks</figcaption>
        </figure>
    </main>
</body>
</html>
