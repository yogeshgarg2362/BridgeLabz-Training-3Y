
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; }
    .profile { background: linear-gradient(135deg, #fff, #e7f0ff); }
    .profile-img {
      width: 150px; height: 150px;
      object-fit: cover; border: 4px solid #0d6efd;
    }
  </style>
</head>
<body class="bg-light text-dark">
  <main class="container py-5">
    <section class="profile p-5 mt-4 mb-3 text-center rounded-4 shadow-sm">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300"
           alt="Profile portrait" class="img-fluid rounded-circle profile-img mb-4">
      <h1 class="fw-bold">Yogesh Garg</h1>
      <p class="lead">BTech CSE Student | Aspiring Cybersecurity Professional</p>
      <p>Interested in web development, networking, and cybersecurity.</p>
      <a href="mailto:hello@example.com" class="btn btn-primary me-2">Hire Me</a>
      <a href="cv.pdf" download class="btn btn-outline-dark">Download CV</a>
    </section>

    <section class="card p-4 mt-4 shadow-sm">
      <h2 class="h4 text-center fw-bold mb-3">Contact Me</h2>
      <form action="mailto:hello@example.com" method="post" enctype="text/plain">
        <label for="name" class="form-label">Your Name</label>
        <input id="name" name="name" class="form-control mb-3" required>

        <label for="email" class="form-label">Email Address</label>
        <input id="email" name="email" type="email" class="form-control mb-3" required>

        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-control mb-3" rows="4" required></textarea>

        <button class="btn btn-primary w-100" type="submit">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
