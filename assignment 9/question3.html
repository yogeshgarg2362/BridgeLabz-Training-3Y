
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechStore Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-card { transition: transform .3s, box-shadow .3s; }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 1rem 2rem #0002 !important;
    }
    .product-card img { height: 190px; object-fit: cover; }
  </style>
</head>
<body>
  <header class="bg-dark text-white p-4">
    <div class="container d-flex justify-content-between flex-wrap">
      <h1 class="h3">TechStore</h1><span>Technology for Everyone</span>
    </div>
  </header>

  <main class="container py-5">
    <h2 class="text-center fw-bold mb-4">Featured Products</h2>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-3">
        <article class="card product-card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" class="card-img-top" alt="Headphones">
          <div class="card-body d-flex flex-column">
            <h3 class="h5">Headphones</h3><p>Clear, immersive sound.</p>
            <p class="fw-bold">₹1,999</p>
            <button class="btn btn-primary mt-auto" type="button">Add to Cart</button>
          </div>
        </article>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <article class="card product-card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" class="card-img-top" alt="Watch">
          <div class="card-body d-flex flex-column">
            <h3 class="h5">Smartwatch</h3><p>Style meets technology.</p>
            <p class="fw-bold">₹2,499</p>
            <button class="btn btn-primary mt-auto" type="button">Add to Cart</button>
          </div>
        </article>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <article class="card product-card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" class="card-img-top" alt="Camera">
          <div class="card-body d-flex flex-column">
            <h3 class="h5">Camera</h3><p>Capture every moment.</p>
            <p class="fw-bold">₹5,499</p>
            <button class="btn btn-primary mt-auto" type="button">Add to Cart</button>
          </div>
        </article>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <article class="card product-card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500" class="card-img-top" alt="Smart device">
          <div class="card-body d-flex flex-column">
            <h3 class="h5">Smart Device</h3><p>Convenience for daily life.</p>
            <p class="fw-bold">₹3,299</p>
            <button class="btn btn-primary mt-auto" type="button">Add to Cart</button>
          </div>
        </article>
      </div>
    </div>
  </main>
  <footer class="bg-dark text-white text-center p-3">© 2026 TechStore</footer>
</body>
</html>
